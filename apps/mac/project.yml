# Xcode project for the Modlight Mac app. Generated with `xcodegen generate` (tools/mac-build.sh
# does it); the .xcodeproj itself is not committed.
name: Modlight
options:
  bundleIdPrefix: io.github.login-tb
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  ModlightEngine:
    path: ModlightEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: XAA9KRRKHR
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Modlight:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: ../../spec/help
        type: folder
        buildPhase: resources
    dependencies:
      - package: ModlightEngine
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Modlight
        CFBundleDisplayName: Modlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "MIT License. Not affiliated with RunPod."
        SUFeedURL: https://github.com/LOGIN-TB/modlight/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.login-tb.modlight
        PRODUCT_NAME: Modlight
        CODE_SIGN_ENTITLEMENTS: App/Modlight.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_PUBLIC_KEY: "V6MqqMrAxWsUuOcLhOVYb10YIoIdnKulyoRcmqvIB3I="
        ENABLE_APP_SANDBOX: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
