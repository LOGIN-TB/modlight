# Xcode project for the Podlight Mac app. Generated with `xcodegen generate` (tools/mac-build.sh
# does it); the .xcodeproj itself is not committed.
name: Podlight
options:
  bundleIdPrefix: io.github.login-tb
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  PodlightEngine:
    path: PodlightEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: XAA9KRRKHR
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Podlight:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: ../../spec/help
        type: folder
        buildPhase: resources
    dependencies:
      - package: PodlightEngine
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Podlight
        CFBundleDisplayName: Podlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "MIT License. Not affiliated with RunPod."
        SUFeedURL: https://github.com/LOGIN-TB/podlight/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.login-tb.podlight
        PRODUCT_NAME: Podlight
        CODE_SIGN_ENTITLEMENTS: App/Podlight.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_PUBLIC_KEY: "V6MqqMrAxWsUuOcLhOVYb10YIoIdnKulyoRcmqvIB3I="
        ENABLE_APP_SANDBOX: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
