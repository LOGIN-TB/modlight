name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: PodlightEngine against spec/
    # Pinned rather than macos-latest: a runner-image rollover that silently swaps the Xcode
    # version should show up as a deliberate change here, not as a mystery failure.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The package needs Swift 6.2+ and the macOS 26 SDK. Pick the newest Xcode 26 or later on
      # the image and say which, so a failure can be traced to the toolchain at a glance.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 or later on this runner"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: apps/mac/PodlightEngine
        run: swift test

      # The dead-man switch runs inside every pod; tested against a fake RunPod API.
      - name: watchdog
        run: python3 -I tools/test_watchdog.py

      - name: pod start script parses
        run: bash -n apps/mac/PodlightEngine/Sources/PodlightEngine/Resources/boot.sh

      # spec/ is the contract between implementations; a file that does not parse would let
      # every runner skip it silently.
      - name: spec files are valid JSON
        run: for f in spec/cases/*.json spec/data/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }; done

  app:
    name: Mac app builds, every string translated
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - name: German for every string
        run: python3 -I tools/i18n/apply.py apps/mac/App/Localizable.xcstrings
      - name: Build (unsigned)
        working-directory: apps/mac
        run: |
          xcodegen generate
          xcodebuild -project Podlight.xcodeproj -scheme Podlight -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -5

