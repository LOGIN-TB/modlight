name: CI

on:
  push:
    branches: [main]
    # A release tag publishes the server image under its version as well.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ModlightEngine against spec/
    # Pinned rather than macos-latest: a runner-image rollover that silently swaps the Xcode
    # version should show up as a deliberate change here, not as a mystery failure.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The package needs Swift 6.2+ and the macOS 26 SDK. Pick the newest Xcode 26 or later on
      # the image and say which, so a failure can be traced to the toolchain at a glance.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 or later on this runner"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: apps/mac/ModlightEngine
        run: swift test

      # The dead-man switch runs inside every pod; tested against a fake RunPod API.
      - name: watchdog
        run: python3 -I tools/test_watchdog.py

      - name: pod start script parses
        run: bash -n spec/pod/boot.sh

      # Piped into sh on Debian, where sh is dash: no bash-only syntax.
      - name: server install script parses
        run: dash -n server/install.sh

      # spec/ is the contract between implementations; a file that does not parse would let
      # every runner skip it silently.
      - name: spec files are valid JSON
        run: for f in spec/cases/*.json spec/data/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }; done

  app:
    name: Mac app builds, every string translated
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - name: German for every string
        run: python3 -I tools/i18n/apply.py apps/mac/App/Localizable.xcstrings
      - name: Build (unsigned)
        working-directory: apps/mac
        run: |
          xcodegen generate
          xcodebuild -project Modlight.xcodeproj -scheme Modlight -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -5


  server:
    name: Server against spec/, image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: npm ci
        working-directory: server
        run: npm ci
      - name: typecheck
        working-directory: server
        run: npx tsc --noEmit
      # The same spec/cases as the Swift engine, plus the server's own end-to-end tests.
      - name: test
        working-directory: server
        run: npm test

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Through the metadata action: it lowercases the repository name, which a tag must be.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # Both architectures when publishing, so the image runs on an ARM VPS or a NAS as well.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
